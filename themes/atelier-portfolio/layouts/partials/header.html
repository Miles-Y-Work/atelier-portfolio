<header class="site-header" data-site-header>
  <div class="site-shell header-inner">
    <a class="site-mark" href="{{ site.Home.RelPermalink }}" aria-label="{{ site.Params.artistName }} home">
      {{ site.Params.initials | default "YN" }}
    </a>
    <nav class="site-nav" aria-label="Main navigation" uk-dropnav="mode: hover; offset: 8">{{ partial "nav-links.html" (dict "page" . "mobile" false) }}</nav>
    <details class="mobile-menu" data-mobile-menu>
      <summary aria-label="Menu"><span aria-hidden="true"></span><span aria-hidden="true"></span></summary>
      <nav class="mobile-menu-panel" aria-label="Mobile navigation">{{ partial "nav-links.html" (dict "page" . "mobile" true) }}</nav>
    </details>
  </div>
</header>
